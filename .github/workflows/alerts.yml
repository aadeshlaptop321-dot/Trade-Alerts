name: alerts
on:
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test Telegram message"
        type: boolean
        default: false
  schedule:
    - cron: "*/30 3-18 * * 1-5"
concurrency:
  group: alerts
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Load state
        run: |
          git fetch origin state:refs/remotes/origin/state || true
          git show origin/state:state.json > state.json 2>/dev/null || echo '{}' > state.json
      - name: Check
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.test }}" = "true" ]; then python alerts.py --test; else python alerts.py; fi
      - name: Save state
        run: |
          cp state.json /tmp/state.json
          if git ls-remote --exit-code origin state >/dev/null 2>&1; then
            git checkout -f -B state origin/state
          else
            git checkout --orphan state; git rm -rf . >/dev/null 2>&1 || true
          fi
          cp /tmp/state.json state.json
          git add state.json
          git -c user.name=alerts -c user.email=alerts@users.noreply.github.com commit -m "state" || exit 0
          git push origin state
